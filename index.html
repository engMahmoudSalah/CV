<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Curriculum Vitae - Mahmoud Salah</title>
  <!-- استدعاء مكتبة PDF.js لعرض الملفات برمجياً بدون iframe -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background-color: #525659;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 0;
      min-height: 100vh;
    }
    #pdf-viewer {
      display: flex;
      flex-direction: column;
      gap: 15px;
      align-items: center;
      width: 100%;
    }
    canvas {
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      max-width: 100%;
      height: auto !important;
      border-radius: 4px;
    }
    .loading {
      color: #ffffff;
      font-family: sans-serif;
      font-size: 18px;
      margin-top: 50px;
    }
  </style>
</head>
<body>

  <div id="pdf-viewer">
    <div class="loading" id="loading-text">جاري تحميل السيرة الذاتية...</div>
  </div>

  <script>
    const url = 'Resumee.pdf';

    // ضبط مسار الـ Worker الخاص بالمكتبة
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    const container = document.getElementById('pdf-viewer');
    const loadingText = document.getElementById('loading-text');

    pdfjsLib.getDocument(url).promise.then(function(pdfDoc) {
      loadingText.remove(); // إزالة نص التحميل عند بدء العرض

      // حلقة تكرارية لترندة كل صفحات الـ PDF (لو اليمين صفحة أو صفحتين)
      for (let pageNum = 1; pageNum <= pdfDoc.numPages; pageNum++) {
        pdfDoc.getPage(pageNum).then(function(page) {
          const scale = 1.5; // دقة ووضوح الـ PDF
          const viewport = page.getViewport({ scale: scale });

          const canvas = document.createElement('canvas');
          const context = canvas.getContext('2d');
          canvas.height = viewport.height;
          canvas.width = viewport.width;

          container.appendChild(canvas);

          const renderContext = {
            canvasContext: context,
            viewport: viewport
          };
          page.render(renderContext);
        });
      }
    }).catch(function(error) {
      loadingText.textContent = 'حدث خطأ أثناء تحميل السيرة الذاتية.';
      console.error(error);
    });
  </script>

</body>
</html>
